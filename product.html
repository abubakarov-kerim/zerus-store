<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Товар — Technic Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#080810; --surface:#0F1426; --surface2:#131A30; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
            --blue:#3E6BFF; --blue-br:#5c84ff; --blue-soft:rgba(62,107,255,.14); --gold:#C9A86A; --gold-soft:rgba(201,168,106,.13);
            --text:#F2F0EA; --muted:#9BA0B5; --muted2:#6B6F85; --pill:999px; --ease:cubic-bezier(.2,.7,.3,1);
            --disp:'Space Grotesk',sans-serif; --sans:'Manrope',-apple-system,sans-serif;
        }
        *{ box-sizing:border-box; }
        body{ font-family:var(--sans); font-weight:300; color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
            background:radial-gradient(1100px 620px at 50% -8%, #10172E 0%, transparent 60%), var(--bg) fixed; }
        h1,h2,h3,h4,h5{ font-family:var(--disp); letter-spacing:-.02em; }
        ::selection{ background:var(--blue); color:#fff; }
        .navbar-apple { background:rgba(9,10,20,.72); backdrop-filter:blur(16px) saturate(140%); border-bottom:1px solid var(--line); }
        .navbar-apple .navbar-brand { color:var(--text); font-family:var(--disp); font-weight:600; letter-spacing:-.01em; }
        .navbar-apple .navbar-brand:hover{ color:var(--gold); }
        .text-secondary { color:var(--muted) !important; font-weight:300; }
        .text-success{ color:#6fcf97 !important; } .text-danger{ color:#e06a5a !important; }
        .btn-apple { display:inline-flex; align-items:center; gap:8px; background:var(--blue); color:#fff; border:none; border-radius:var(--pill); padding:12px 28px; font-weight:500; font-size:.92rem; text-decoration:none; cursor:pointer; box-shadow:0 10px 28px -10px rgba(62,107,255,.7); transition:background .25s, transform .2s; }
        .btn-apple:hover { background:var(--blue-br); color:#fff; transform:translateY(-1px); }
        .btn-dark { display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line2)!important; color:var(--text); background:transparent; border-radius:var(--pill); padding:11px 26px; font-weight:500; text-decoration:none; transition:border-color .25s,color .25s; }
        .btn-dark:hover{ border-color:var(--gold)!important; color:var(--gold); }
        .eyebrow{ font-family:var(--disp); font-size:.66rem; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); font-weight:600; }
        .img-block { background:linear-gradient(140deg, var(--surface2), var(--surface) 72%); border:1px solid var(--line); border-radius:22px; padding:34px; text-align:center; box-shadow:0 30px 70px -34px rgba(0,0,0,.9); position:relative; overflow:hidden; }
        .img-block::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(var(--gold),transparent); }
        .img-block img { max-width:100%; max-height:390px; object-fit:contain; filter:drop-shadow(0 22px 28px rgba(0,0,0,.6)); transition:opacity .25s ease; }
        .price-big { font-size:2.1rem; font-weight:700; font-family:var(--disp); }
        .color-btn, .opt-btn { border:1px solid var(--line2); background:transparent; color:var(--text); border-radius:12px; padding:10px 16px; margin:0 8px 8px 0; cursor:pointer; text-align:left; font-weight:400; transition:.2s; }
        .color-btn { border-radius:var(--pill); }
        .color-btn:hover, .opt-btn:hover{ border-color:var(--muted); }
        .color-btn.active, .opt-btn.active { border-color:var(--blue); background:var(--blue-soft); color:var(--blue-br); font-weight:600; }
        .opt-btn .sub { display:block; font-size:.78rem; color:var(--muted2); font-weight:400; }
        .opt-btn.active .sub { color:var(--blue-br); }
        .lbl-soon{ display:inline-block; font-family:var(--disp); font-size:.66rem; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); border:1px solid var(--gold-soft); background:var(--gold-soft); padding:6px 14px; border-radius:var(--pill); }
        #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(120px); background:var(--surface2); border:1px solid var(--line2); color:var(--text); padding:13px 26px; border-radius:14px; opacity:0; transition:all .3s ease; z-index:1000; display:flex; align-items:center; gap:9px; }
        #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
        #toast i{ color:#6fcf97; }
        @keyframes slideInLeft  { from { opacity:0; transform:translateX(-50px); } to { opacity:1; transform:none; } }
        @keyframes slideInRight { from { opacity:0; transform:translateX(50px);  } to { opacity:1; transform:none; } }
        .img-col  { animation: slideInLeft  .55s var(--ease) both; }
        .info-col { animation: slideInRight .55s var(--ease) both; animation-delay:.08s; }
        @media(prefers-reduced-motion:reduce){ *{ animation:none!important; } }
    </style>
</head>
<body>

    <nav class="navbar navbar-apple px-4 sticky-top">
        <a href="store.html" class="navbar-brand fs-6 text-decoration-none"><i class="bi bi-arrow-left"></i> В магазин</a>
        <a href="order.html" class="btn-apple"><i class="bi bi-bag"></i> Заказ (<span id="cartCount">0</span>)</a>
    </nav>

    <div class="container my-4" style="max-width:1120px" id="productBox"></div>
    <div id="toast"><i class="bi bi-check-circle-fill"></i> Добавлено в корзину</div>

    <script src="products.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.getElementById('cartCount').textContent = cart.length;

        const id = new URLSearchParams(location.search).get('id');
        const p = findProduct(id);
        const box = document.getElementById('productBox');
        const toast = document.getElementById('toast');

        // цвет → кружок
        const COLORHEX = {
            'Чёрный':'#1d1d1f','Космический чёрный':'#1d1d1f','Титановый чёрный':'#2b2b2e','Чёрный титан':'#2b2b2e','Тёмная ночь':'#2e3641','Полночь':'#2e3641','Тёмно-синий':'#2e4a6b',
            'Графитовый':'#4a4a4a','Серый космос':'#4a4a4a','Серый':'#8a8a8a','Титановый серый':'#8a8a8a',
            'Белый':'#f2f2f0','Титановый белый':'#e8e8e8','Серебристый':'#dcdedd','Титановый натуральный':'#c9c3ba','Натуральный титан':'#c9c3ba','Пустынный титан':'#b8a084','Ваниль':'#f3e6c8','Кремовый':'#efe7d3','Сияющая звезда':'#efe7d3',
            'Синий':'#4a6a9a','Титановый синий':'#4d5b6a','Небесно-голубой':'#a9c7e0','Ультрамарин':'#3a3fb0','Бирюзовый':'#7fb7c4',
            'Зелёный':'#5b8a72','Тёмно-зелёный':'#33503f','Светлый мох':'#8a9a5b','Мятный':'#a8d5c0',
            'Розовый':'#e7c0c8','Красный':'#c0392b','Жёлтый':'#e8c848','Титановый жёлтый':'#d9c47a',
            'Фиолетовый':'#7a5b9a','Тёмно-фиолетовый':'#4b3b57','Титановый фиолетовый':'#6a5f8a','Лавандовый':'#c3b6e0','Космический оранжевый':'#d4753a','Золотой':'#e3c78a'
        };
        function colorHex(name){ return COLORHEX[name] || '#c7c7cc'; }

        // состояние выбора
        let vIndex = 0, sIndex = 0, selectedColor = null;
        if (p) {
            if (p.type === 'config') selectedColor = p.versions[0].colors[0] || null;
            else if (p.colors && p.colors.length) selectedColor = p.colors[0];
        }

        function colorsBlock(colors) {
            if (!colors || !colors.length) return '';
            let h = '<p class="mt-4 mb-2 fw-medium">Цвет:</p><div>';
            colors.forEach(c => {
                h += `<button class="color-btn ${c===selectedColor?'active':''}" onclick="pickColor('${c}')">
                    <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${colorHex(c)};border:1px solid #c7c7cc;vertical-align:-2px;margin-right:7px"></span>${c}</button>`;
            });
            h += `</div>`;
            return h;
        }

        function render() {
            if (!p) { box.innerHTML = '<h2 class="mt-4">Товар не найден</h2><a href="store.html">← Вернуться в магазин</a>'; return; }

            // --- СКОРО ---
            if (p.soon) {
                box.innerHTML = `
                <a href="store.html" class="text-decoration-none text-secondary">← Все товары</a>
                <div class="row mt-2 g-4 align-items-center">
                    <div class="col-md-6 img-col"><div class="img-block"><img src="${p.img}" alt="${p.name}" style="filter:brightness(0.9)"></div></div>
                    <div class="col-md-6 info-col">
                        <span class="lbl-soon">Скоро в продаже</span>
                        <h1 class="fw-bold mt-3">${p.name}</h1>
                        <p class="text-secondary">${p.desc || ''}</p>
                        <p class="price-big" style="color:var(--gold)">В продаже с ${p.release}</p>
                        <p class="text-secondary">Оформи предзаказ уже сейчас — напиши в Telegram, и мы придержим для тебя ${p.name}.</p>
                        <a href="https://t.me/zerus9501" class="btn-apple mt-2"><i class="bi bi-telegram"></i> Оформить предзаказ</a>
                    </div>
                </div>`;
                return;
            }

            // --- КОНФИГУРАТОР (версия + память + цвет) ---
            if (p.type === 'config') {
                const v = p.versions[vIndex];
                if (!v.colors.includes(selectedColor)) selectedColor = v.colors[0] || null;
                const s = p.storage[sIndex];
                const price = v.price + s.add;
                const img = (v.colorImages && v.colorImages[selectedColor]) ? v.colorImages[selectedColor] : v.img;

                let versionsHTML = '<p class="mt-4 mb-2 fw-medium">Модель:</p><div>';
                p.versions.forEach((vv, i) => {
                    versionsHTML += `<button class="opt-btn ${i===vIndex?'active':''}" onclick="pickVersion(${i})">${vv.name}<span class="sub">от ${vv.price.toLocaleString('ru-RU')} ₽</span></button>`;
                });
                versionsHTML += '</div>';

                let storageHTML = '<p class="mt-4 mb-2 fw-medium">Память:</p><div>';
                p.storage.forEach((ss, i) => {
                    const sub = ss.add ? `+${ss.add.toLocaleString('ru-RU')} ₽` : 'базовая';
                    storageHTML += `<button class="opt-btn ${i===sIndex?'active':''}" onclick="pickStorage(${i})">${ss.name}<span class="sub">${sub}</span></button>`;
                });
                storageHTML += '</div>';

                box.innerHTML = `
                <a href="store.html" class="text-decoration-none text-secondary">← Все товары</a>
                <div class="row mt-2 g-4 align-items-start">
                    <div class="col-md-6 img-col"><div class="img-block"><img id="mainImg" src="${img}" alt="${v.name}"></div></div>
                    <div class="col-md-6 info-col">
                        <h1 class="fw-bold">${v.name}</h1>
                        <p class="text-secondary">${p.desc || ''}</p>
                        <p class="price-big">${price.toLocaleString('ru-RU')} ₽</p>
                        <p><span class="text-success"><i class="bi bi-check-circle"></i> В наличии</span></p>
                        ${versionsHTML}
                        ${storageHTML}
                        ${colorsBlock(v.colors)}
                        <p class="text-secondary mt-2">Выбрано: <b>${v.name} · ${s.name}${selectedColor ? ' · ' + selectedColor : ''}</b></p>
                        <div class="d-flex gap-2 flex-wrap mt-3">
                            <button class="btn-apple" onclick="addConfig()">Добавить в корзину</button>
                            <a href="order.html" class="btn btn-dark" style="border-radius:980px;padding:10px 26px">Оформить заказ →</a>
                        </div>
                    </div>
                </div>`;
                return;
            }

            // --- ОБЫЧНЫЙ ТОВАР ---
            const inStock = p.stock > 0;
            const stockText = inStock ? `<span class="text-success"><i class="bi bi-check-circle"></i> В наличии: ${p.stock} шт.</span>` : `<span class="text-danger"><i class="bi bi-x-circle"></i> Нет в наличии</span>`;
            const img = (p.colorImages && p.colorImages[selectedColor]) ? p.colorImages[selectedColor] : p.img;
            const addBtn = inStock
                ? `<button class="btn-apple mt-3" onclick="addSimple()">Добавить в корзину</button>`
                : `<button class="btn btn-secondary mt-3" disabled style="border-radius:980px;padding:10px 26px">Нет в наличии</button>`;
            box.innerHTML = `
                <a href="store.html" class="text-decoration-none text-secondary">← Все товары</a>
                <div class="row mt-2 g-4 align-items-center">
                    <div class="col-md-6 img-col"><div class="img-block"><img id="mainImg" src="${img}" alt="${p.name}"></div></div>
                    <div class="col-md-6 info-col">
                        <h1 class="fw-bold">${p.name}</h1>
                        <p class="text-secondary">${p.desc || ''}</p>
                        <p class="price-big">${p.price.toLocaleString('ru-RU')} ₽</p>
                        <p>${stockText}</p>
                        ${colorsBlock(p.colors)}
                        ${selectedColor ? `<p class="text-secondary mt-2">Выбрано: <b>${selectedColor}</b></p>` : ''}
                        <div class="d-flex gap-2 flex-wrap mt-3">
                            ${addBtn}
                            <a href="order.html" class="btn btn-dark mt-3" style="border-radius:980px;padding:10px 26px">Оформить заказ →</a>
                        </div>
                    </div>
                </div>`;
        }

        function pickVersion(i) { vIndex = i; sIndex = 0; render(); }
        function pickStorage(i) { sIndex = i; render(); }
        function pickColor(c)   { selectedColor = c; render(); }

        function showToast() { toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1500); }

        function addConfig() {
            const v = p.versions[vIndex], s = p.storage[sIndex];
            const name = `${v.name} · ${s.name}${selectedColor ? ' · ' + selectedColor : ''}`;
            cart.push({ name, price: v.price + s.add });
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cartCount').textContent = cart.length;
            showToast();
        }
        function addSimple() {
            const name = selectedColor ? `${p.name} — ${selectedColor}` : p.name;
            cart.push({ name, price: p.price });
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cartCount').textContent = cart.length;
            showToast();
        }

        render();
    </script>

</body>
</html>
