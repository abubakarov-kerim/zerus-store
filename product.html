<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Товар — Zerus Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
    <style>
        body { background:linear-gradient(180deg,#cfe6ff 0%,#eaf3ff 45%,#f5f5f7 100%); background-attachment:fixed; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#1d1d1f; }
        .navbar-apple { background:rgba(255,255,255,0.8); backdrop-filter:blur(12px); border-bottom:1px solid #d2d2d7; }
        .btn-apple { background:#0071e3; color:#fff; border:none; border-radius:980px; padding:10px 26px; font-weight:500; }
        .btn-apple:hover { background:#0077ed; color:#fff; }
        .img-block { background:#fff; border-radius:22px; padding:30px; text-align:center; box-shadow:0 4px 18px rgba(0,0,0,0.06); }
        .img-block img { max-width:100%; max-height:380px; object-fit:contain; }
        .price-big { font-size:2rem; font-weight:700; }
        .color-btn { border:1.5px solid #d2d2d7; background:#fff; color:#1d1d1f; border-radius:980px; padding:7px 18px; margin:0 8px 8px 0; cursor:pointer; }
        .color-btn.active { border-color:#0071e3; background:#eaf3ff; color:#0071e3; font-weight:600; }
        #toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(120px); background:#1d1d1f; color:#fff; padding:12px 26px; border-radius:14px; opacity:0; transition:all .3s ease; z-index:1000; }
        #toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
        /* --- анимация входа: фото слева, детали справа --- */
        @keyframes slideInLeft  { from { opacity:0; transform:translateX(-50px); } to { opacity:1; transform:none; } }
        @keyframes slideInRight { from { opacity:0; transform:translateX(50px);  } to { opacity:1; transform:none; } }
        .img-col  { animation: slideInLeft  .55s cubic-bezier(.2,.7,.3,1) both; }
        .info-col { animation: slideInRight .55s cubic-bezier(.2,.7,.3,1) both; animation-delay:.08s; }
    </style>
</head>
<body>

    <nav class="navbar navbar-apple px-4 sticky-top">
        <a href="store.html" class="navbar-brand fs-5 text-decoration-none">← В магазин</a>
        <a href="order.html" class="btn btn-apple">🛒 Заказ (<span id="cartCount">0</span>)</a>
    </nav>

    <div class="container my-4" id="productBox"></div>

    <div id="toast">✅ Добавлено в корзину</div>

    <script src="products.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.getElementById('cartCount').textContent = cart.length;

        const id = new URLSearchParams(location.search).get('id');
        const p = findProduct(id);
        let selectedColor = (p && p.colors && p.colors.length) ? p.colors[0] : null;

        const box = document.getElementById('productBox');
        const toast = document.getElementById('toast');

        function render() {
            if (!p) { box.innerHTML = '<h2 class="mt-4">Товар не найден</h2><a href="store.html">← Вернуться в магазин</a>'; return; }
            const inStock = p.stock > 0;
            const stockText = inStock
                ? `<span class="text-success">✅ В наличии: ${p.stock} шт.</span>`
                : `<span class="text-danger">❌ Нет в наличии</span>`;

            let colorsHTML = '';
            if (p.colors && p.colors.length) {
                colorsHTML = '<p class="mt-4 mb-2 fw-medium">Цвет:</p><div>';
                p.colors.forEach(c => {
                    colorsHTML += `<button class="color-btn ${c===selectedColor?'active':''}" onclick="pickColor('${c}')">${c}</button>`;
                });
                colorsHTML += `</div><p class="text-secondary mt-2">Выбрано: <b>${selectedColor}</b></p>`;
            }

            const addBtn = inStock
                ? `<button class="btn-apple mt-3" onclick="addToCart()">Добавить в корзину</button>`
                : `<button class="btn btn-secondary mt-3" disabled style="border-radius:980px;padding:10px 26px">Нет в наличии</button>`;

            box.innerHTML = `
                <a href="store.html" class="text-decoration-none text-secondary">← Все товары</a>
                <div class="row mt-2 g-4 align-items-center">
                    <div class="col-md-6 img-col">
                        <div class="img-block"><img src="${p.img}" alt="${p.name}"></div>
                    </div>
                    <div class="col-md-6 info-col">
                        <h1 class="fw-bold">${p.name}</h1>
                        <p class="text-secondary">${p.desc || ''}</p>
                        <p class="price-big">${p.price.toLocaleString('ru-RU')} ₽</p>
                        <p>${stockText}</p>
                        ${colorsHTML}
                        <div class="d-flex gap-2 flex-wrap mt-3">
                            ${addBtn}
                            <a href="order.html" class="btn btn-dark mt-3" style="border-radius:980px;padding:10px 26px">Оформить заказ →</a>
                        </div>
                    </div>
                </div>`;
        }

        function pickColor(c) { selectedColor = c; render(); }

        function addToCart() {
            const name = selectedColor ? `${p.name} — ${selectedColor}` : p.name;
            cart.push({ name: name, price: p.price });
            localStorage.setItem('cart', JSON.stringify(cart));
            document.getElementById('cartCount').textContent = cart.length;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }

        render();
    </script>

</body>
</html>
