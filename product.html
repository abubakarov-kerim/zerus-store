<script>
var TECH_BUILD='2026-10-17.2';
(function(d){ d.className+=' js';
  try{ var t=localStorage.getItem('zerus_theme')||localStorage.getItem('zerus_theme_def'); if(t==='light') d.setAttribute('data-theme','light');
    var p=sessionStorage.getItem('zerus_pal_preview')||localStorage.getItem('zerus_palette'); if(p&&p!=='azure') d.setAttribute('data-palette',p); }catch(e){}
})(document.documentElement);
(function(){
  if(location.protocol.indexOf('http')!==0 || !window.fetch) return;
  fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(t){
    var m=t.match(/TECH_BUILD='([^']+)'/); if(!m || m[1]===TECH_BUILD) return;
    try{ if(sessionStorage.getItem('tech_upd')===m[1]) return; sessionStorage.setItem('tech_upd',m[1]); }catch(e){ return; }
    var q=new URLSearchParams(location.search); q.set('v',m[1]); location.replace(location.pathname+'?'+q.toString()+location.hash);
  }).catch(function(){});
})();
</script>
<style>
.pp{ padding-top:clamp(18px,3vw,34px); }
.crumbs{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.86rem; color:var(--mut); margin-bottom:clamp(18px,3vw,32px); }
.crumbs a:hover{ color:var(--text); } .crumbs i{ font-size:.7rem; color:var(--mut2); } .crumbs span{ color:var(--text); }

:root[data-theme="light"] .pp-turn img{ filter:drop-shadow(0 34px 36px rgba(20,40,30,.2)); }
.pp-turn img.swap{ opacity:0; transform:scale(.97); }

.pp-thumbs::-webkit-scrollbar{ display:none; }
.pp-thumbs button{ flex:0 0 74px; height:74px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--surf); padding:8px; cursor:pointer; transition:border-color .25s, transform .3s var(--ease); }
.pp-thumbs button:hover{ transform:translateY(-2px); }
.pp-thumbs button.on{ border-color:var(--text); box-shadow:inset 0 0 0 1px var(--text); }
.pp-thumbs img{ width:100%; height:100%; object-fit:contain; }
.pp-info .pc-cat{ margin-bottom:12px; }

.pp-desc{ color:var(--mut); margin-top:14px; line-height:1.6; max-width:52ch; }
.pp-pr{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-top:24px; }

@keyframes tick{ 0%{ opacity:.35; transform:translateY(6px); } }

.og-h b{ font-weight:500; } .og-h span{ color:var(--mut); text-align:right; }
.seg{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
.seg.tight{ grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); }

.opt.on{ border-color:var(--ac); background:var(--ac-soft); box-shadow:inset 0 0 0 1px var(--ac); }
.opt.on small{ color:var(--ac); }
.sw{ display:flex; flex-wrap:wrap; gap:12px; }
.swb{ width:42px; height:42px; border-radius:50%; border:1px solid var(--line2); padding:3px; background:transparent; cursor:pointer; transition:transform .3s var(--ease), border-color .25s; }
.swb i{ display:block; width:100%; height:100%; border-radius:50%; background:var(--c); box-shadow:inset 0 0 0 1px rgba(128,128,128,.35), inset 0 -6px 10px rgba(0,0,0,.18); }
.swb:hover{ transform:scale(1.06); }
.swb.on{ border-color:var(--text); box-shadow:0 0 0 1px var(--text); }
.pp-buy{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:30px; }
.perks{ margin-top:26px; border-top:1px solid var(--line); }
.perk{ display:flex; gap:14px; align-items:flex-start; padding:16px 0; border-bottom:1px solid var(--line); }
.perk i{ color:var(--ac); font-size:1.15rem; margin-top:1px; } .perk b{ font-weight:500; display:block; font-size:.95rem; } .perk span{ color:var(--mut); font-size:.86rem; }
.specs{ margin-top:clamp(60px,8vw,100px); }
.spec-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:clamp(10px,1.4vw,16px); }
.spec{ border-radius:var(--r); background:var(--surf); border:1px solid var(--line); padding:20px; }
.spec .k{ font-family:var(--mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--mut2); }

  margin:0 calc(-1 * clamp(16px,4vw,40px)); padding:4px clamp(16px,4vw,40px) 6px; scroll-padding-inline:clamp(16px,4vw,40px); }
.rel-rail::-webkit-scrollbar{ display:none; } .rel-rail .pc{ scroll-snap-align:start; }
.nf{ text-align:center; padding:clamp(60px,12vw,140px) 0; } .nf i{ font-size:2.6rem; color:var(--mut); } .nf h1{ font-size:clamp(2rem,4vw,3rem); margin-top:18px; } .nf p{ color:var(--mut); margin:12px auto 28px; max-width:40ch; }
/* скелет до загрузки данных */
.sk-line{ height:14px; border-radius:7px; background:linear-gradient(100deg, var(--surf2) 30%, var(--surf3) 50%, var(--surf2) 70%); background-size:300% 100%; animation:skel 1.4s linear infinite; margin:10px 0; }
/* нижняя панель покупки (телефон) */
.buybar{ position:fixed; left:0; right:0; bottom:0; z-index:340; display:none; align-items:center; gap:12px; padding:12px clamp(16px,4vw,24px) calc(env(safe-area-inset-bottom,0px) + 12px);
  background:var(--glass); -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%); border-top:1px solid var(--line);
  transform:translateY(110%); transition:transform .5s var(--ease); }
.buybar.show{ transform:none; }
.buybar .bb-t{ flex:1; min-width:0; } .buybar .bb-t span{ display:block; font-size:.78rem; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.buybar .bb-t b{ font-weight:560; font-size:1.1rem; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.buybar .btn{ height:48px; }
@media (max-width:1024px){ .spec-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:860px){
  .pp-grid{ grid-template-columns:1fr; }
  .pp-media{ position:static; }
  .pp-stage{ aspect-ratio:1/0.9; }
  .buybar{ display:flex; }
  body.has-bar .foot{ padding-bottom:84px; }
}
@media (max-width:560px){
  .pp-buy{ grid-template-columns:1fr; }
  .seg{ grid-template-columns:1fr 1fr; } .seg.tight{ grid-template-columns:repeat(3,1fr); }
  .opt{ padding:11px 12px; } .opt b{ font-size:.9rem; }
  .spec-grid{ grid-template-columns:1fr 1fr; } .spec{ padding:16px; } .spec .v{ font-size:.95rem; }
  .pp-thumbs button{ flex-basis:62px; height:62px; }
}
</style>

<script>
(function(){
  "use strict";
  var $=function(s){ return document.querySelector(s); };
  var esc=CMS.esc;
  var COLORHEX = {
    'Чёрный':'#1d1d1f','Космический чёрный':'#1d1d1f','Титановый чёрный':'#2b2b2e','Чёрный титан':'#2b2b2e','Тёмная ночь':'#2e3641','Полночь':'#2e3641','Тёмно-синий':'#24364f',
    'Графитовый':'#4a4a4a','Серый космос':'#4a4a4a','Серый':'#8a8a8a','Титановый серый':'#8a8a8a',
    'Белый':'#f2f2f0','Титановый белый':'#e8e8e6','Серебристый':'#dcdedd','Титановый натуральный':'#c9c3ba','Натуральный титан':'#c9c3ba','Пустынный титан':'#b8a084','Титановый золотой':'#c8a96a','Ваниль':'#f3e6c8','Кремовый':'#efe7d3','Сияющая звезда':'#efe7d3',
    'Синий':'#4a6a9a','Титановый синий':'#4d5b6a','Небесно-голубой':'#a9c7e0','Ультрамарин':'#3a3fb0','Бирюзовый':'#7fb7c4',
    'Зелёный':'#5b8a72','Тёмно-зелёный':'#33503f','Светлый мох':'#8a9a5b','Мятный':'#a8d5c0',
    'Розовый':'#e7c0c8','Красный':'#c0392b','Жёлтый':'#e8c848','Титановый жёлтый':'#d9c47a',
    'Фиолетовый':'#7a5b9a','Тёмно-фиолетовый':'#4b3b57','Титановый фиолетовый':'#6a5f8a','Лавандовый':'#c3b6e0','Космический оранжевый':'#d4753a','Золотой':'#e3c78a'
  };
  var hexOf=function(n){ return COLORHEX[n]||'#c7c7cc'; };

  var id=new URLSearchParams(location.search).get('id');
  var p=null, vI=0, sI=0, simI=0, color=null, first=true;

  function find(){ p=CMS.getProducts().find(function(x){ return x.id===id; }) || null; }
  function initSel(){
    vI=Math.min(vI,(p&&p.versions?p.versions.length-1:0)); sI=0; simI=0; color=null;
    if(!p) return;
    if(CMS.isConfig(p)){ var v=p.versions[vI]; color=(v.colors||[])[0]||null; }
    else if(p.colors&&p.colors.length) color=p.colors[0];
  }
  function cur(){
    if(!p) return null;
    if(CMS.isConfig(p)){
      var v=p.versions[vI], s=(p.storage||[])[sI]||{name:'',add:0}, sim=(p.sim&&p.sim.length)?p.sim[simI]:null;
      if(v.colors && v.colors.indexOf(color)<0) color=v.colors[0]||null;
      var img=(v.colorImages&&v.colorImages[color]) || v.img || p.img;
      return { title:v.name, price:(+v.price||0)+(+s.add||0)+(sim?+sim.add||0:0), img:img,
        name:v.name+(s.name?' · '+s.name:'')+(sim?' · '+sim.name:'')+(color?' · '+color:''), colors:v.colors||[], colorImages:v.colorImages||{} };
    }
    var img2=(p.colorImages&&p.colorImages[color]) || p.img;
    return { title:p.name, price:+p.price||0, img:img2, name:p.name+(color?' · '+color:''), colors:p.colors||[], colorImages:p.colorImages||{} };
  }

  function optsHTML(){
    if(!CMS.isConfig(p)) return '';
    var v=p.versions[vI], h='';
    if(p.versions.length>1){
      h+='<div class="og"><div class="og-h"><b>Модель</b><span>'+esc(v.name)+'</span></div><div class="seg">'+p.versions.map(function(x,i){
        return '<button class="opt'+(i===vI?' on':'')+'" data-k="v'+i+'" data-v="'+i+'" aria-pressed="'+(i===vI)+'"><b>'+esc(x.name)+'</b><small>от '+CMS.money(x.price)+'</small></button>'; }).join('')+'</div></div>';
    }
    if(p.storage && p.storage.length){
      h+='<div class="og"><div class="og-h"><b>Память</b><span>'+esc(p.storage[sI].name)+'</span></div><div class="seg tight">'+p.storage.map(function(x,i){
        return '<button class="opt'+(i===sI?' on':'')+'" data-k="s'+i+'" data-s="'+i+'" aria-pressed="'+(i===sI)+'"><b>'+esc(x.name)+'</b><small>'+(x.add?'+'+CMS.money(x.add):'базовая')+'</small></button>'; }).join('')+'</div></div>';
    }
    if(p.sim && p.sim.length){
      h+='<div class="og"><div class="og-h"><b>SIM-карта</b><span>'+esc(p.sim[simI].name)+'</span></div><div class="seg tight">'+p.sim.map(function(x,i){
        return '<button class="opt'+(i===simI?' on':'')+'" data-k="m'+i+'" data-m="'+i+'" aria-pressed="'+(i===simI)+'"><b>'+esc(x.name)+'</b><small>'+(x.name==='eSIM'?'только электронная':'физическая + eSIM')+'</small></button>'; }).join('')+'</div></div>';
    }
    return h;
  }
  function colorsHTML(c){
    if(!c.colors.length) return '';
    return '<div class="og"><div class="og-h"><b>Цвет</b><span>'+esc(color||'')+'</span></div><div class="sw" role="radiogroup" aria-label="Цвет">'+c.colors.map(function(n){
      return '<button class="swb'+(n===color?' on':'')+'" data-k="c'+esc(n)+'" data-c="'+esc(n)+'" role="radio" aria-checked="'+(n===color)+'" aria-label="'+esc(n)+'" title="'+esc(n)+'"><i style="--c:'+hexOf(n)+'"></i></button>'; }).join('')+'</div></div>';
  }
  function thumbsHTML(c){
    var keys=c.colors.filter(function(n){ return c.colorImages[n]; });
    if(keys.length<2) return '';
    return '<div class="pp-thumbs">'+keys.map(function(n){ return '<button class="'+(n===color?'on':'')+'" data-c="'+esc(n)+'" aria-label="Фото: '+esc(n)+'"><img src="'+esc(CMS.thumb(c.colorImages[n]))+'" alt="" loading="lazy"></button>'; }).join('')+'</div>';
  }

  function render(){
    var box=$('#box');
    if(!p){
      document.title='Товар не найден · '+CMS.getStore().name;
      box.innerHTML='<div class="nf"><i class="bi bi-box-seam"></i><h1>Товар не найден</h1><p>Возможно, его уже убрали из каталога. Посмотрите похожие модели.</p><a class="btn" href="index.html#catalog" data-cat="">Открыть каталог <i class="bi bi-arrow-right"></i></a></div>';
      $('#specs').hidden=true; $('#rel').hidden=true; $('#buybar').classList.remove('show'); document.body.classList.remove('has-bar'); return;
    }
    var focusK=document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    var c=cur(), stock=CMS.inStock(p), cat=CMS.catOf(p);
    document.title=c.title+' · купить в '+CMS.getStore().name;
    var adm=CMS.isAdmin()?'<button class="cms-inline" style="margin-top:14px" onclick="editProduct(\''+esc(p.id)+'\')"><i class="bi bi-pencil"></i>Изменить товар</button>':'';
    var stockHTML = p.soon ? '<div class="pp-stock soon"><i class="bi bi-clock"></i>'+(p.release?'В продаже с '+esc(p.release):'Скоро в продаже')+'</div>'
      : stock ? '<div class="pp-stock"><i class="bi bi-check2-circle"></i>В наличии</div>' : '<div class="pp-stock out"><i class="bi bi-x-circle"></i>Нет в наличии</div>';
    var priceHTML = p.soon ? '<span class="pp-price" style="color:var(--ac)">Скоро</span>' : '<span class="pp-price" id="pPrice">'+CMS.money(c.price)+'</span>'+(!CMS.isConfig(p)&&p.oldPrice>p.price?'<span class="pp-old">'+CMS.money(p.oldPrice)+'</span>':'');
    var buy = p.soon ? '<a class="btn" style="grid-column:1/-1" data-tg-link data-pre href="#" target="_blank" rel="noopener"><i class="bi bb-telegram"></i>Оформить предзаказ</a>'
      : stock ? '<button class="btn" id="addBtn"><i class="bi bi-bag-plus"></i>В корзину</button><button class="btn ghost" id="buyBtn">Купить сейчас</button>'
      : '<a class="btn ghost" style="grid-column:1/-1" data-tg-link href="#" target="_blank" rel="noopener"><i class="bi bi-bell"></i>Узнать о поступлении</a>';
    var prevImg=$('#mainImg');
    box.innerHTML=
      '<nav class="crumbs" aria-label="Навигация"><a href="index.html">Главная</a><i class="bi bi-chevron-right"></i><a href="index.html#catalog" data-cat="'+esc(cat)+'">'+esc(cat)+'</a><i class="bi bi-chevron-right"></i><span>'+esc(p.name)+'</span></nav>'+
      '<div class="pp-grid"><div class="pp-media"><div class="pp-stage" id="stage"><div class="pp-turn" id="turn"><img id="mainImg" src="'+esc(c.img)+'" alt="'+esc(c.title+(color?', '+color:''))+'"></div><div class="pp-floor"></div></div>'+thumbsHTML(c)+'</div>'+
      '<div class="pp-info"><div class="pc-cat">'+esc(cat)+'</div><h1>'+esc(c.title)+'</h1>'+adm+
      '<p class="pp-desc">'+esc(p.desc||p.description||'')+'</p>'+
      '<div class="pp-pr">'+priceHTML+'</div>'+stockHTML+
      optsHTML()+colorsHTML(c)+
      '<div class="pp-buy">'+buy+'</div>'+
      '<div class="perks"><div class="perk"><i class="bi bb-truck"></i><div><b>Бесплатная доставка</b><span>По всей России, от 3 дней</span></div></div>'+
      '<div class="perk"><i class="bi bi-shield-check"></i><div><b>Официальная гарантия</b><span>1 год на всю технику</span></div></div>'+
      '<div class="perk"><i class="bi bi-patch-check"></i><div><b>Оригинал</b><span>Можно проверить при получении</span></div></div></div>'+
      '</div></div>';
    if(prevImg && !first){ var ni=$('#mainImg'); if(prevImg.getAttribute('src')!==ni.getAttribute('src')){ ni.classList.add('swap'); var done=function(){ requestAnimationFrame(function(){ ni.classList.remove('swap'); }); }; if(ni.complete) done(); else { ni.onload=done; ni.onerror=done; } } }
    if(!first && $('#pPrice')){ $('#pPrice').classList.add('tick'); }
    first=false;
    if(focusK){ var f=document.querySelector('[data-k="'+focusK.replace(/"/g,'\\"')+'"]'); if(f) f.focus({preventScroll:true}); }
    paintTg(); tilt();
    // характеристики
    var sp=p.specs||[];
    $('#specs').hidden=!sp.length;
    $('#specGrid').innerHTML=sp.map(function(s,i){ return '<div class="spec rv" style="--d:'+(Math.min(i,8)*.03)+'s"><div class="k">'+esc(s.k)+'</div><div class="v">'+esc(s.v)+'</div></div>'; }).join('');
    // похожие
    var rel=CMS.getProducts().filter(function(x){ return x.id!==p.id && CMS.catOf(x)===cat; });
    if(rel.length<4) rel=rel.concat(CMS.getProducts().filter(function(x){ return x.id!==p.id && rel.indexOf(x)<0; }).slice(0,8-rel.length));
    rel=rel.slice(0,8);
    $('#rel').hidden=!rel.length; $('#relRail').innerHTML=rel.map(CMS.card).join('');
    CMS.observeReveal();
    // нижняя панель
    $('#bbName').textContent=c.name; $('#bbPrice').textContent=p.soon?'Скоро':CMS.money(c.price);
    $('#bbBtn').textContent = p.soon ? 'Предзаказ' : stock ? 'В корзину' : 'Узнать';
  }

  function paintTg(){
    var tg=CMS.getStore().telegram;
    document.querySelectorAll('#box [data-tg-link]').forEach(function(a){ if(tg){ a.href='https://t.me/'+encodeURIComponent(tg); a.hidden=false; } else a.hidden=true; });
  }
  var tiltOn=matchMedia('(pointer:fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tilt(){
    if(!tiltOn) return; var st=$('#stage'), t=$('#turn'); if(!st) return; var raf=0, rx=0, ry=0;
    st.addEventListener('pointermove',function(e){ var r=st.getBoundingClientRect(); ry=((e.clientX-r.left)/r.width-.5)*18; rx=-((e.clientY-r.top)/r.height-.5)*12;
      if(!raf) raf=requestAnimationFrame(function(){ raf=0; t.style.setProperty('--ry',ry.toFixed(2)+'deg'); t.style.setProperty('--rx',rx.toFixed(2)+'deg'); }); });
    st.addEventListener('pointerleave',function(){ t.style.setProperty('--ry','0deg'); t.style.setProperty('--rx','0deg'); });
  }

  function add(){ var c=cur(); CMS.cart.add({ id:p.id, name:c.name, price:c.price, img:c.img }); }
  document.addEventListener('click',function(e){
    var b;
    if((b=e.target.closest('[data-v]'))){ vI=+b.dataset.v; sI=Math.min(sI,(p.storage||[1]).length-1); render(); return; }
    if((b=e.target.closest('[data-s]'))){ sI=+b.dataset.s; render(); return; }
    if((b=e.target.closest('[data-m]'))){ simI=+b.dataset.m; render(); return; }
    if((b=e.target.closest('[data-c]'))){ color=b.dataset.c; render(); return; }
    if(e.target.closest('#addBtn') || (e.target.closest('#bbBtn') && p && !p.soon && CMS.inStock(p))){
      add(); CMS.toast('Добавлено в корзину',{href:'order.html',text:'Оформить'}); return; }
    if(e.target.closest('#buyBtn')){ add(); location.href='order.html'; return; }
    if(e.target.closest('#bbBtn')){ var l=document.querySelector('#box [data-tg-link]'); if(l && !l.hidden) l.click(); return; }
    var pre=e.target.closest('[data-pre]');
    if(pre){ var t='Здравствуйте! Хочу оформить предзаказ: '+p.name+'.'; try{ navigator.clipboard.writeText(t); }catch(_){} CMS.toast('Текст предзаказа скопирован. Вставьте его в чат.'); }
  });

  /* панель снизу появляется, когда кнопки покупки ушли за экран */
  var bar=$('#buybar');
  if(window.IntersectionObserver){
    /* два наблюдателя: «кнопки на экране» и «кнопки на экране или выше» — работает даже при резкой прокрутке */
    var onScreen=false, passed=false, watched=null;
    function sync(){ var show=passed && !onScreen && !!p; bar.classList.toggle('show',show); document.body.classList.toggle('has-bar',show); bar.setAttribute('aria-hidden',show?'false':'true'); $('#bbBtn').tabIndex=show?0:-1; }
    var ioA=new IntersectionObserver(function(es){ onScreen=es[es.length-1].isIntersecting; sync(); });
    var ioB=new IntersectionObserver(function(es){ passed=es[es.length-1].isIntersecting; sync(); },{rootMargin:'100000px 0px 0px 0px'});
    new MutationObserver(function(){ var t=document.querySelector('.pp-buy'); if(t && t!==watched){ if(watched){ ioA.unobserve(watched); ioB.unobserve(watched); } watched=t; ioA.observe(t); ioB.observe(t); } }).observe($('#box'),{childList:true});
  }

  CMS.init({ footerEl:'cmsFooter', onChange:function(){ var keep=p&&p.id; find(); if(!p || p.id!==keep) initSel(); render(); } });
  find(); initSel(); render();
})();
</script>
</body>
</html>
