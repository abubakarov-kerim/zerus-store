<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Apple Store — Керим</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <!-- ВЕРХНЕЕ МЕНЮ -->
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fs-4">🍎 Apple Store</span>
        <a href="заказ.html" class="btn btn-light">🛒 Оформить заказ (<span id="cartCount">0</span>)</a>
    </nav>

    <div class="container my-4">
        <h1 class="mb-4">Каталог техники Apple</h1>
        <!-- Сюда JavaScript вставит карточки товаров -->
        <div class="row" id="catalog"></div>
    </div>

    <script>
        // === СПИСОК ТОВАРОВ (массив объектов — как список словарей в Python) ===
        const products = [
            { id: 'macbook', name: 'MacBook Air M3', emoji: '💻', price: 120000, stock: 5 },
            { id: 'iphone',  name: 'iPhone 15 Pro',  emoji: '📱', price: 110000, stock: 8 },
            { id: 'airpods', name: 'AirPods Pro 2',  emoji: '🎧', price: 22000,  stock: 12 },
            { id: 'ipad',    name: 'iPad Air',       emoji: '📲', price: 70000,  stock: 0 },
        ];

        // Корзина: берём из памяти браузера (или пустую, если ещё ничего не заказано)
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        const catalog = document.getElementById('catalog');
        const cartCount = document.getElementById('cartCount');

        // === НАРИСОВАТЬ ВСЕ КАРТОЧКИ ТОВАРОВ ===
        function render() {
            catalog.innerHTML = '';  // очистить перед перерисовкой

            products.forEach(p => {
                const inStock = p.stock > 0;

                // строка про наличие
                const stockText = inStock
                    ? `<span class="text-success">✅ В наличии: ${p.stock} шт.</span>`
                    : `<span class="text-danger">❌ Нет в наличии</span>`;

                // кнопка: активная если есть в наличии, серая если нет
                const button = inStock
                    ? `<button class="btn btn-primary w-100" onclick="addToCart('${p.id}')">Добавить в корзину</button>`
                    : `<button class="btn btn-secondary w-100" disabled>Нет в наличии</button>`;

                // сам квадратик-карточка
                catalog.innerHTML += `
                    <div class="col-md-3 mb-4">
                        <div class="card h-100 text-center p-3">
                            <div style="font-size:64px">${p.emoji}</div>
                            <h5>${p.name}</h5>
                            <p class="fs-5 fw-bold">${p.price.toLocaleString('ru-RU')} ₽</p>
                            <p>${stockText}</p>
                            ${button}
                        </div>
                    </div>`;
            });

            cartCount.textContent = cart.length;  // обновить счётчик в меню
        }

        // === ДОБАВИТЬ ТОВАР В КОРЗИНУ ===
        function addToCart(id) {
            const product = products.find(p => p.id === id);   // найти товар по id
            if (product.stock > 0) {
                product.stock = product.stock - 1;             // уменьшить наличие
                cart.push({ name: product.name, price: product.price });  // положить в корзину
                localStorage.setItem('cart', JSON.stringify(cart));       // сохранить
                render();                                       // перерисовать (кол-во изменится)
            }
        }

        render();  // нарисовать магазин при загрузке страницы
    </script>

</body>
</html>
