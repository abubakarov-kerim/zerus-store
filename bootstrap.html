<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Магазин на Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary px-4">
        <span class="navbar-brand">Мой магазин</span>
        <span class="navbar-text text-white">Каталог · Контакты</span>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card p-3">
                    <h5>iPhone</h5>
                    <p>90000 руб.</p>
                    <button class="btn btn-primary">В корзину</button>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card p-3">
                    <h5>MacBook</h5>
                    <p>150000 руб.</p>
                    <button class="btn btn-primary">В корзину</button>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card p-3">
                    <h5>AirPods</h5>
                    <p>20000 руб.</p>
                    <button class="btn btn-primary">В корзину</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
