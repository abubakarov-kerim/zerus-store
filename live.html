<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Живая корзина</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">

    <h1>Мой магазин</h1>
    <p class="fs-4">Товаров в корзине: <span id="count">0</span></p>
    <button id="addBtn" class="btn btn-primary">Добавить в корзину</button>

    <script>
        // коробка-счётчик, начинаем с нуля
        let count = 0;

        // находим кнопку и место, где показан счётчик
        const btn = document.getElementById('addBtn');
        const countSpan = document.getElementById('count');

        // когда кнопку нажимают — выполнить это
        btn.addEventListener('click', () => {
            count = count + 1;              // увеличиваем на 1
            countSpan.textContent = count;  // показываем новое число
        });
    </script>

</body>
</html>
