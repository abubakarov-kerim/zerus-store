<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформление заказа — Apple Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
    <style>
        body { background:linear-gradient(180deg,#cfe6ff 0%,#eaf3ff 45%,#f5f5f7 100%); background-attachment:fixed; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#1d1d1f; }
        .navbar-apple { background:rgba(255,255,255,0.8); backdrop-filter:blur(12px); border-bottom:1px solid #d2d2d7; }
        .btn-apple { background:#0071e3; color:#fff; border:none; border-radius:980px; padding:8px 22px; font-weight:500; }
        .btn-apple:hover { background:#0077ed; color:#fff; }
        .block { background:#fff; border-radius:16px; padding:20px 24px; margin-bottom:16px; }
        .order-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f0f0f0; }
        .order-item:last-child { border-bottom:none; }
        .contact-btn { border-radius:980px; padding:10px 24px; font-weight:500; }
    </style>
</head>
<body>

    <nav class="navbar navbar-apple px-4 sticky-top">
        <a href="store.html" class="navbar-brand fs-4 fw-bold text-decoration-none text-dark">Zerus</a><span class="ms-2 text-secondary">· Оформление заказа</span>
        <a href="store.html" class="btn btn-apple">← В магазин</a>
    </nav>

    <div class="container my-4" style="max-width:720px;">
        <h1 class="fw-bold mb-4">Ваш заказ</h1>

        <div class="block" id="orderBlock"></div>

        <div class="block">
            <h5 class="mb-3">🚚 Доставка</h5>
            <p class="mb-2">Доставка по всей России — <b>бесплатно</b>, 3–7 дней (СДЭК / Почта России).</p>
            <label class="form-label">Ваш город для доставки:</label>
            <input type="text" id="city" class="form-control" placeholder="Например: Грозный" style="max-width:320px;">
        </div>

        <div class="block">
            <h5 class="mb-3">Свяжитесь для оформления и оплаты:</h5>
            <p class="text-secondary">Напишите в Telegram — отвечу по заказу, оплате и доставке.</p>
            <div class="d-flex gap-2 flex-wrap">
                <a href="https://t.me/zerus9501" class="btn btn-info contact-btn text-white btn-lg">✈️ Написать в Telegram</a>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const orderBlock = document.getElementById('orderBlock');

        function render() {
            if (cart.length === 0) {
                orderBlock.innerHTML = '<p class="text-secondary mb-0">Корзина пуста — выбери товары в магазине</p>';
                return;
            }
            let total = 0;
            let html = '';
            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="order-item">
                        <span class="fw-medium">${item.name}</span>
                        <span class="d-flex align-items-center gap-3">
                            <span>${item.price.toLocaleString('ru-RU')} ₽</span>
                            <button class="btn btn-sm btn-outline-danger" style="border-radius:980px" onclick="removeItem(${index})">✕</button>
                        </span>
                    </div>`;
            });
            html += `<div class="order-item"><h4 class="mb-0 mt-2">Итого:</h4><h4 class="mb-0 mt-2">${total.toLocaleString('ru-RU')} ₽</h4></div>`;
            orderBlock.innerHTML = html;
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            render();
        }

        render();
    </script>

</body>
</html>
