<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Оформление заказа — Technic Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>(function(){try{if(localStorage.getItem('zerus_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
    <style>
        :root{
            --bg:#0A0A0C; --surface:#141418; --surface2:#1B1B21; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
            --blue:#2F6BFF; --blue-br:#5a86ff; --gold:#2F6BFF; --gold-soft:rgba(47,107,255,.14);
            --text:#F5F5F7; --muted:#9A9AA3; --muted2:#6A6A73; --pill:999px; --disp:'Space Grotesk',sans-serif; --sans:'Manrope',-apple-system,sans-serif;
            --glass:rgba(12,12,15,.72); --panel:rgba(255,255,255,.02); --bgglow:#12152B; --inp:rgba(255,255,255,.04); --inp2:rgba(255,255,255,.07);
        }
        :root[data-theme="light"]{
            --bg:#F5F5F7; --surface:#FFFFFF; --surface2:#FFFFFF; --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.14);
            --blue:#0A5FE0; --blue-br:#0A5FE0; --gold:#0A5FE0; --gold-soft:rgba(10,95,224,.1);
            --text:#1D1D1F; --muted:#6E6E73; --muted2:#9093A0;
            --glass:rgba(255,255,255,.82); --panel:rgba(0,0,0,.025); --bgglow:#E7ECF5; --inp:rgba(0,0,0,.035); --inp2:rgba(0,0,0,.06);
        }
        *{ box-sizing:border-box; }
        body{ font-family:var(--sans); font-weight:300; color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
            background:radial-gradient(1100px 620px at 50% -8%, var(--bgglow) 0%, transparent 60%), var(--bg) fixed; }
        h1,h2,h3,h4,h5{ font-family:var(--disp); letter-spacing:-.02em; }
        ::selection{ background:var(--blue); color:#fff; }
        .navbar-apple{ background:var(--glass); backdrop-filter:blur(16px) saturate(140%); border-bottom:1px solid var(--line); }
        .navbar-apple .navbar-brand{ color:var(--text); font-family:var(--disp); font-weight:600; letter-spacing:-.01em; }
        .text-secondary{ color:var(--muted)!important; font-weight:300; }
        .eyebrow{ font-family:var(--disp); font-size:.66rem; letter-spacing:.26em; text-transform:uppercase; color:var(--muted); font-weight:600; }
        .btn-apple{ display:inline-flex; align-items:center; gap:8px; background:var(--blue); color:#fff; border:none; border-radius:var(--pill); padding:10px 24px; font-weight:500; text-decoration:none; cursor:pointer; transition:background .25s,transform .2s; box-shadow:0 10px 26px -12px rgba(62,107,255,.7); }
        .btn-apple:hover{ background:var(--blue-br); color:#fff; transform:translateY(-1px); }
        .block{ background:linear-gradient(140deg, var(--surface2), var(--surface) 72%); border:1px solid var(--line); border-radius:18px; padding:24px 26px; margin-bottom:18px; box-shadow:0 26px 60px -34px rgba(0,0,0,.9); position:relative; overflow:hidden; }
        .block::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(var(--gold),transparent); }
        .block h5{ font-weight:600; display:flex; align-items:center; gap:10px; }
        .block h5 i{ color:var(--gold); }
        .order-item{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
        .order-item:last-child{ border-bottom:none; }
        .order-item .nm{ font-weight:500; }
        .order-item .pr{ font-family:var(--disp); font-weight:600; white-space:nowrap; }
        .total-row{ border-top:1px solid var(--line2)!important; margin-top:4px; padding-top:16px; }
        .total-row h4{ font-weight:700; margin:0; } .total-row .sum{ color:var(--gold); }
        .rm{ width:30px; height:30px; display:grid; place-items:center; border:1px solid var(--line2); background:transparent; color:var(--muted); border-radius:50%; cursor:pointer; transition:.2s; }
        .rm:hover{ border-color:#e06a5a; color:#e06a5a; }
        .form-control{ background:var(--inp); border:1px solid var(--line2); color:var(--text); border-radius:12px; padding:11px 15px; }
        .form-control::placeholder{ color:var(--muted2); }
        .form-control:focus{ background:var(--inp2); border-color:var(--blue); color:var(--text); box-shadow:none; }
        .tg-btn{ display:inline-flex; align-items:center; gap:9px; background:#229ED9; color:#fff; border:none; border-radius:var(--pill); padding:13px 28px; font-weight:500; text-decoration:none; transition:transform .2s,filter .2s; }
        .tg-btn:hover{ color:#fff; transform:translateY(-1px); filter:brightness(1.07); }
        @media(prefers-reduced-motion:reduce){ *{ animation:none!important; } }
    </style>
</head>
<body>

    <nav class="navbar navbar-apple px-4 sticky-top">
        <a href="store.html" class="navbar-brand fs-5 text-decoration-none">Technic</a>
        <a href="store.html" class="btn-apple"><i class="bi bi-arrow-left"></i> В магазин</a>
    </nav>

    <div class="container my-5" style="max-width:720px;">
        <div class="eyebrow mb-2">Оформление</div>
        <h1 class="fw-bold mb-4">Ваш заказ</h1>

        <div class="block" id="orderBlock"></div>

        <div class="block">
            <h5 class="mb-3"><i class="bi bi-truck"></i>Доставка</h5>
            <p class="mb-3 text-secondary">Доставка по всей России — <b style="color:var(--text)">бесплатно</b>, 3–7 дней (СДЭК / Почта России).</p>
            <label class="form-label text-secondary mb-2">Ваш город для доставки:</label>
            <input type="text" id="city" class="form-control" placeholder="Например: Грозный" style="max-width:340px;">
        </div>

        <div class="block">
            <h5 class="mb-2"><i class="bi bi-chat-dots"></i>Оформление и оплата</h5>
            <p class="text-secondary">Нажмите «Оформить заказ» — соберём готовый текст вашего заказа и отправим менеджеру в удобный мессенджер: WhatsApp, Telegram или Instagram.</p>
            <button class="btn-apple mt-1" style="padding:13px 30px" onclick="checkout()"><i class="bi bi-bag-check"></i> Оформить заказ</button>
        </div>
    </div>

    <footer style="border-top:1px solid var(--line);margin-top:40px;background:var(--panel)">
        <div class="container" id="cmsFooter" style="max-width:960px;padding:48px 16px 30px"></div>
    </footer>

    <script src="cms.js?v=6"></script>
    <script>
        CMS.init({ footerEl:'cmsFooter' });
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const orderBlock = document.getElementById('orderBlock');
        function checkout(){ if(!cart.length){ return; } CMS.openOrder(cart); }

        function render() {
            if (cart.length === 0) {
                orderBlock.innerHTML = '<p class="text-secondary mb-0">Корзина пуста — выберите технику в магазине.</p>';
                return;
            }
            let total = 0, html = '';
            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="order-item">
                        <span class="nm">${item.name}</span>
                        <span class="d-flex align-items-center gap-3">
                            <span class="pr">${item.price.toLocaleString('ru-RU')} ₽</span>
                            <button class="rm" onclick="removeItem(${index})" aria-label="Убрать"><i class="bi bi-x-lg"></i></button>
                        </span>
                    </div>`;
            });
            html += `<div class="order-item total-row"><h4>Итого</h4><h4 class="sum">${total.toLocaleString('ru-RU')} ₽</h4></div>`;
            orderBlock.innerHTML = html;
        }
        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            render();
        }
        render();
    </script>

</body>
</html>
